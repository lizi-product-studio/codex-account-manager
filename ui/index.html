<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Codex 账号管家</title>
<link rel="stylesheet" href="style.css?v=1.3.3">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">◆</span>Codex 账号管家</div>
  <span class="pill" id="codexStatus">检测中…</span>
  <div class="spacer"></div>
  <button class="btn ghost" id="btnUsagePage" title="在浏览器打开官方用量页面">官方用量页 ↗</button>
  <button class="btn ghost" id="btnFolder" title="打开账号存档目录">存档目录</button>
  <button class="btn ghost" id="btnRefresh" title="重新读取">⟳ 刷新</button>
  <button class="btn ghost" id="btnSettings" title="设置">⚙ 设置<span class="nav-dot" id="settingsDot" hidden></span></button>
</header>

<div class="banner" id="banner" hidden></div>
<div class="banner info" id="waitBanner" hidden></div>
<div class="banner info" id="updateBanner" hidden></div>

<div class="scroll" id="scroll">
  <section class="overview" id="overview">
    <div class="muted">正在读取本地数据…</div>
  </section>

  <div class="section-title">
    <span>账号详情</span>
    <span class="muted small">双击卡片即可切换</span>
  </div>
  <main class="list" id="list"></main>
</div>

<footer class="footer">
  <button class="btn primary" id="btnAdd">＋ 登录新账号</button>
  <button class="btn" id="btnSave">保存当前登录</button>
  <label class="chk"><input type="checkbox" id="chkLaunch" checked> 切换后自动启动 Codex</label>
  <div class="spacer"></div>
  <span class="muted small" id="footInfo"></span>
</footer>

<!-- 通用弹窗 -->
<div class="mask" id="modal" hidden>
  <div class="dialog">
    <div class="dialog-title" id="mTitle"></div>
    <div class="dialog-body" id="mBody"></div>
    <input class="input" id="mInput" hidden>
    <div class="dialog-actions" id="mActions"></div>
  </div>
</div>

<!-- 设置 -->
<div class="mask" id="settings" hidden>
  <div class="dialog wide">
    <div class="dialog-title">设置</div>
    <label class="opt" id="optCloseToTray"><input type="checkbox" data-key="close_to_tray">
      <div><b>关闭窗口时缩到托盘</b><span>点 × 后程序继续在后台记录额度；右键右下角托盘图标可切换账号或退出。</span></div></label>
    <label class="opt"><input type="checkbox" data-key="autostart">
      <div><b>开机自动启动</b><span id="autostartDesc">开机后只在托盘显示，不弹窗口。</span></div></label>
    <label class="opt"><input type="checkbox" data-key="launch_after_switch">
      <div><b>切换后自动启动 Codex</b><span>关闭后，切换完需要你自己打开 Codex。</span></div></label>
    <label class="opt"><input type="checkbox" data-key="notify_enabled">
      <div><b>系统通知提醒</b><span>当前号剩余不足 15%、用尽的号恢复、订阅 3 天内到期或检测到新登录时提醒。</span></div></label>
    <label class="opt"><input type="checkbox" data-key="auto_check_update">
      <div><b>后台自动检查更新</b><span>定时检查 GitHub 仓库更新并推送系统通知，仅同步代码、不触碰账号凭证。</span></div></label>
    <div class="update-box" id="updateBox">
      <div class="update-row">
        <div>
          <b>程序版本 <span id="updateVer"></span></b>
          <div class="muted small" id="updateDesc"></div>
        </div>
        <div class="update-actions">
          <button class="btn sm" id="btnCheckUpdate">检查更新</button>
          <button class="btn primary sm" id="btnApplyUpdate" hidden>立即更新并重启</button>
        </div>
      </div>
      <div class="update-commits" id="updateCommits" hidden></div>
    </div>
    <div class="note-box">
      <b>安全说明</b><br>
      · 当前登录账号会通过本机官方 Codex 程序（codex）同步实时额度；其他未登录账号仅读取本地记录，绝不后台探测。<br>
      · 账号凭证保存在 <code id="storeDir"></code>，请勿分享该目录。<br>
      · 不要在 Codex 里点“退出登录”，那会让已保存的凭证失效；添加新号请用“登录新账号”。
    </div>
    <div class="dialog-actions">
      <button class="btn danger" id="btnQuit">退出程序</button>
      <span class="spacer"></span>
      <button class="btn primary" id="btnSettingsClose">完成</button>
    </div>
  </div>
</div>

<div class="mask" id="busy" hidden>
  <div class="busy-box">
    <div class="spinner"></div>
    <div>
      <div id="busyText">处理中…</div>
      <div class="steps" id="busySteps"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="app.js?v=1.3.3"></script>
</body>
</html>
